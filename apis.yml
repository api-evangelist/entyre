aid: entyre
name: Entyre Care
description: 'Entyre Care is a US home health care provider that helps people who care
  for a friend or family member at home get paid for the care they already provide.
  Through state Medicaid structured / self-directed family caregiving programs, Entyre
  Care guides caregivers through eligibility and enrollment, handles the paperwork,
  and delivers financial compensation alongside professional caregiving guidance and
  emotional support. The company operates in Maine, Massachusetts, Michigan, New Hampshire,
  Ohio, Virginia, and Wisconsin, offering tools such as a compensation calculator, a
  step-by-step guide to getting paid, and localized care teams. Entyre Care is a
  consumer-facing healthcare services business and does not currently publish a public
  developer program or API; this profile was surfaced as a portfolio company of HV
  Capital and enriched with the company''s real identity and public web properties.'
